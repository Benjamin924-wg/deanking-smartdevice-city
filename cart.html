<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeanKing Smartdevice City</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand" aria-label="DeanKing Smartdevice City logo">
        <div class="logo-mark">DK</div>
        <div class="brand-text">
          <span class="brand-name">DeanKing</span>
          <small>Smartdevice City</small>
        </div>
      </div>
      <nav>
        <a href="DeanKing-Smartdevice-City.html">Home</a>
        <a href="DeanKing-Smartdevice-City.html">Shop</a>
        <a href="DeanKing-Smartdevice-City.html#about">About</a>
        <a href="DeanKing-Smartdevice-City.html#contact">Contact</a>
        <a href="cart.html">Cart</a>
      </nav>
    </header>

    <main class="cart-section">
      <h2>Your Cart</h2>
      <div id="cart-items"></div>
      <div id="cart-total">Total: ₦0</div>

      <div class="checkout-details" style="margin: 30px 0; display: grid; gap: 12px; max-width: 520px;">
        <label for="checkoutName">Full name</label>
        <input type="text" id="checkoutName" placeholder="Enter your full name" autocomplete="name">
      </div>

      <div class="payment-choice" style="margin: 30px 0; display: flex; gap: 20px; flex-wrap: wrap; align-items: center;">
        <label><input type="radio" name="paymentMethod" value="Bank Transfer" checked /> Bank Transfer</label>
        <label><input type="radio" name="paymentMethod" value="Cash on Delivery" /> Cash on Delivery</label>
      </div>
      <p id="checkout-status" role="status" aria-live="polite"></p>

      <button type="button" onclick="clearCart()">Clear Cart</button>
      <button type="button" onclick="checkout()">Checkout</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
